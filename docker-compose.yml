version: '3.8'

services:
  voxsplit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voxsplit-service
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=VoxSplit
      - DEBUG=false
      - WHISPER_MODEL_SIZE=tiny
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_CPU_THREADS=4
      - VAD_AGGRESSIVENESS=3
      - VAD_PADDING_DURATION_MS=300
      - VAD_MIN_SPEECH_DURATION_MS=250
      - SPEAKER_SIMILARITY_THRESHOLD=0.72
    volumes:
      # Persistent cache volume to prevent re-downloading Whisper models on restart
      - voxsplit-model-cache:/home/appuser/.cache
    deploy:
      resources:
        limits:
          cpus: '4.00'
          memory: 4096M
        reservations:
          cpus: '1.00'
          memory: 1024M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  voxsplit-model-cache:
    driver: local

